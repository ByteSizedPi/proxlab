##############################################
# 🦎 Komodo Core — the control plane itself 🦎 #
##############################################
#
# Adapted from the upstream mongo.compose.yaml, with ONE deliberate change:
# the `periphery` service has been REMOVED.
#
# Why: Komodo manages this very stack. If Periphery ran in this stack, then
# redeploying Core would restart Periphery mid-deploy and kill the agent that
# is performing the deploy. Periphery therefore runs as a systemd unit on the
# host instead — see ../periphery/README.md.
#
# Bootstrap note: this stack is started manually the first time
# (`docker compose up -d` from this directory), then adopted into Komodo as a
# Stack with `files_on_host` pointing here. See ../README.md.
#
# ⚠️ Requires a `.env` symlink next to this file:
#     ln -s compose.env .env
#
# There are two separate env mechanisms and both are needed:
#   - `env_file: ./compose.env` passes variables INTO the core container.
#   - `${KOMODO_DATABASE_USERNAME}` below is substituted by Compose itself,
#     BEFORE any container exists. Compose only reads the shell, `.env`, or
#     an explicit --env-file for that.
#
# Without the symlink every Compose command needs --env-file compose.env —
# including `logs` and `ps`, not just `up`. Forgetting it on one command
# yields "variable is not set" warnings and `invalid spec: :/backups`.

services:
  mongo:
    image: mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping it with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    healthcheck:
      # `ping` is one of the few commands Mongo allows pre-authentication,
      # so this needs no credentials and won't break when they rotate.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Generous: first boot initialises the data directory and creates the
      # root user before it will answer anything.
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: unless-stopped
    depends_on:
      mongo:
        # Wait for Mongo to actually answer, not merely to have started.
        # Without this Core races the database on boot and logs auth errors
        # until it retries into a working state.
        condition: service_healthy
    ports:
      - 9120:9120
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
    extra_hosts:
      # Periphery runs as a systemd unit on the HOST, not in this network.
      # Inside this container "localhost" is the container itself, so Core
      # needs a name that resolves to the host. host-gateway maps to the
      # Docker bridge gateway, which the host listens on ([::]:8120).
      - "host.docker.internal:host-gateway"
    volumes:
      # Core <-> Periphery Noise handshake keys.
      - keys:/config/keys
      # Dated database backups — https://komo.do/docs/setup/backup
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      # Core-level secrets and git provider tokens MUST be supplied in a
      # config file — they cannot be set via environment variables.
      #
      # Commented out by default: if the file doesn't exist, Docker creates a
      # DIRECTORY at that path and Core fails in confusing ways. Create the
      # file first (`cp core.config.toml.example core.config.toml`), THEN
      # uncomment. Only needed for private repos or file-based secrets.
      # - ./core.config.toml:/config/config.toml:ro
    healthcheck:
      # ⚠️ /version is UNDOCUMENTED. Upstream ships no healthchecks in any
      # official compose file and documents no health endpoint, so this was
      # found empirically (200 + a version string on both Core and
      # Periphery). It may change across releases — if Core starts reporting
      # unhealthy after an upgrade, check this before assuming a real fault.
      # `/` also returns 200 but serves the whole UI, so it's a heavier probe.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9120/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo-data:
  mongo-config:
  keys:
