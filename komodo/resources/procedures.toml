## Procedures — ordered batches of executions, runnable on a schedule.
##
## Komodo creates three of these itself on first launch — "Backup Core
## Database" (01:00), "Global Auto Update" (03:00) and "Rotate Server Keys"
## (06:00) — unless KOMODO_DISABLE_INIT_RESOURCES=true. Don't redeclare them
## here or the sync will fight with Core over them.


## ── The single deploy entrypoint ─────────────────────────────────────────
##
## ONE GitHub webhook drives the entire repo. Not one per stack.
##
## The naive design is a webhook per Stack resource, which means every new
## service is a manual click in GitHub's settings — tens of webhooks, each
## able to rot independently, none of them visible in this repo. It also
## can't handle a *new* stack: the webhook can't exist until the resource
## does, so the first deploy is always manual.
##
## Instead GitHub calls this procedure, which does both jobs in order:
##
##   stage 1  RunSync                  reconcile resources/*.toml — create,
##                                     update or retire Komodo resources
##   stage 2  BatchDeployStackIfChanged redeploy only the stacks whose
##                                     contents actually differ
##
## Stages run SEQUENTIALLY (executions *within* a stage run in parallel),
## which is what makes this work: a stack added to stacks.toml is created by
## stage 1 and then deployed by stage 2 in the same run. Adding a service is
## a directory, a [[stack]] block, and a push. No UI, no new webhook.
##
## "IfChanged" is what keeps this from being a sledgehammer. Per Komodo:
##   "Checks deployed contents vs latest contents, and only if any changes
##    found will `docker compose up`."
## So a push touching one compose file restarts one container, not all of
## them. A docs-only push restarts nothing.

[[procedure]]
name = "gitops"
tags = ["platform"]
[procedure.config]

# Fire on push. The webhook URL is
#   /listener/github/procedure/<id>/main
#
# ⚠️ For Procedures and Actions the LAST segment is the BRANCH TO LISTEN ON —
# not an execution name, unlike every other resource type (Stack takes
# /deploy, Sync takes /sync, Repo takes /pull). `/run` here would be read as
# "a branch named run" and the webhook would never fire. Use `/__ANY__` to
# listen on all branches.
#
# This is invisible to probing: branch matching happens AFTER signature
# validation, so /run and /main both answer 401 to an unsigned request. The
# only way to tell them apart is a correctly signed delivery, or the docs.
#
# The ID only exists after this procedure has been synced into Komodo, so the
# first sync must be run by hand from the UI. See BOOTSTRAP.md step 12.
webhook_enabled = true

# Backstop for pushes missed while pve-prod was powered down overnight: a
# webhook fires exactly once and GitHub gives up after a short retry window,
# so a push during downtime is lost permanently. This re-runs the whole
# reconcile on a timer, and costs nothing when nothing changed — stage 2
# compares contents and no-ops.
schedule_format = "English"
schedule = "every 15 minutes"
schedule_enabled = true
schedule_alert = false      # a no-op run every 15 min is not news
failure_alert = true

## ⚠️ CHANGING THIS PROCEDURE REQUIRES A MANUAL SYNC ⚠️
##
## A sync running *inside* a procedure cannot modify that procedure. Stage 1
## runs the sync, so when a commit changes this file the sync tries to rewrite
## the procedure that is currently executing it, retries ten times, and gives
## up with:
##
##   procedure sync loop exited after max iterations
##
## That is not cosmetic. The stage fails, so the procedure aborts and stages 2
## and 3 never run — **all deploys stop** until it is cleared, and every
## subsequent webhook and scheduled run fails the same way because the pending
## self-update is still there.
##
## Worse, the message tells you nothing. Komodo accumulates the real error and
## then discards it (bin/core/src/sync/resources.rs — it builds a detailed
## `log`, then returns `Log::error("run procedure", String::from(...))` with a
## fresh string). The cause is not in the UI or in Core's logs.
##
## FIX: Syncs → `resources` → Execute, by hand in the UI. Run standalone the
## sync is not inside the procedure, so it applies the update and normal
## operation resumes. Verified on pve-prod 2026-08-01: the identical sync
## failed twice via the procedure, then succeeded immediately run manually.
##
## Every other resource type is unaffected — stacks, repos, servers and
## variables all sync fine from inside the procedure. Only this file is
## special, and only because stage 1 is what applies it.

[[procedure.config.stage]]
name = "sync resources"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "resources", enabled = true },
]

[[procedure.config.stage]]
name = "deploy changed stacks"
enabled = true
executions = [
  # `pattern` accepts an id, a name, a wildcard or a regex, and supports
  # comma/newline separated combinations. "*" = every stack, which is the
  # point: this list must never need editing when a service is added.
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", enabled = true },
]

## ⚠️ `*` includes cloudflared, deliberately. Its compose file should still
## redeploy when it changes. The side effect is that redeploying it kills the
## tunnel carrying the very request that triggered this run, so GitHub records
## that delivery as FAILED even though the work completed — the procedure runs
## inside Core and does not care that the caller went away. Check the Komodo
## update log, not GitHub, before believing a failure on a cloudflared push.
##
## ✅ But this is narrower than it sounds: a DEPLOY is not a RESTART.
## DeployStackIfChanged compares file TEXT, so editing only comments in a
## compose.yaml does trigger a deploy — but `docker compose up -d` then
## resolves the config, finds it identical to what is running, and reports
## `Container cloudflared Running` rather than recreating it. The container is
## untouched and the tunnel never drops.
##
## Verified 2026-08-01: a comment-only commit to
## stacks/platform/cloudflared/compose.yaml produced DeployStack success=true
## while the container stayed up with its original uptime and all 18 tunnel
## connections intact. Only a change to the RESOLVED config — image, env,
## ports, volumes, command — actually cuts the tunnel.
##
## ⚠️ If a cloudflared change breaks the tunnel, webhooks stop arriving and
## this procedure can no longer be triggered from GitHub. Recovery is the LAN
## UI (http://10.42.0.11:9120) or the 15-minute schedule above, which is the
## other reason that schedule is enabled.
