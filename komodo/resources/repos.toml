## Repos — git clones Komodo keeps up to date on a server.
##
## Only one is needed, and only because of `komodo-core`.
##
## Every other stack in this repo is a git-mode Stack: Periphery clones the
## repo itself into ${root_directory}/stacks/<stack>/ and pulls it on every
## deploy, so the files are always current by construction.
##
## `komodo-core` can't work that way. Its compose.env holds the Mongo password
## Core needs in order to reach the database that stores Komodo Variables, so
## the secret can't come from a Variable — Core would need the database to
## learn how to reach the database. It therefore runs in `files_on_host` mode
## against a clone that also holds the hand-written compose.env.
##
## But nothing pulls a hand-made clone. Left alone it silently pins Core to
## whatever commit was checked out the day it was created — verified on
## 2026-08-01, when /home/jj/proxlab was found 3 commits behind origin/main
## with no mechanism that would ever have corrected it. Deploys would keep
## "succeeding" against stale files.
##
## Making it a Repo resource hands that job to Komodo: the gitops procedure
## pulls it before the deploy stage, so files_on_host reads current files.

[[repo]]
name = "proxlab"
tags = ["platform"]
[repo.config]
server = "app-prod"

repo = "ByteSizedPi/proxlab"
branch = "main"

# Absolute, so it is used verbatim. A relative path would be taken relative to
# Periphery's repo_dir (${root_directory}/repos) and would clone a SECOND copy
# somewhere else, leaving the real one just as stale as before.
path = "/home/jj/proxlab"

# No webhook here — the gitops procedure pulls this repo as a stage, so it
# stays part of the single-webhook design rather than needing its own.
webhook_enabled = false

# ⚠️ Deliberately NOT setting `environment`. Repo's default `env_file_path` is
# `.env`, and this repo already has komodo/.env as a SYMLINK to compose.env —
# the file holding the Mongo password. Komodo only writes that file when
# `environment` is non-empty, so leaving it unset is what keeps it from
# clobbering the symlink. Do not add an `environment` block here without
# also changing env_file_path to something that isn't `.env`.
