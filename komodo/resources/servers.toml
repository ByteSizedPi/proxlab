## Servers — the Periphery agents Komodo talks to.
##
## Sync this file FIRST, before stacks.toml: every Stack references a server
## by name, and the sync fails if the name doesn't resolve yet.

[[server]]
name = "app-prod"
[server.config]
## Periphery runs as a systemd unit on this host (see ../../periphery/).
## Because Core and Periphery are on the same machine, this stays on
## localhost — do NOT expose 8120 to the network.
##
## ⚠️ The address differs between the two ways Periphery can run:
##
##   systemd on the host  ->  https://host.docker.internal:8120
##       NOT localhost. Core runs in a container, where "localhost" is the
##       container itself — Periphery is on the host and would be
##       unreachable. host.docker.internal resolves to the Docker bridge
##       gateway via the `extra_hosts: host-gateway` entry on the core
##       service in ../compose.yaml. Remove one and the other breaks.
##
##       HTTPS not HTTP: Periphery sets ssl_enabled=true by default and
##       generates a self-signed cert, so plain HTTP is refused.
##
##   container (local dev, compose.periphery.yaml)  ->  https://periphery:8120
##       "periphery" is the compose service name resolved on the container
##       network — NOT localhost, because port 8120 is deliberately not
##       published to the host. And https, because Periphery generates a
##       self-signed cert and enables SSL by default.
##
## Getting this wrong shows up as a permanently "unreachable" server.
address = "https://host.docker.internal:8120"
enabled = true

## Periphery self-signs its certificate, so chain validation cannot succeed.
## This is not the security boundary — the Noise handshake with Periphery's
## public key authenticates the peer; TLS here is only transport encryption
## over loopback. Defaults to true upstream, stated explicitly because a
## security-relevant setting should not be inherited silently.
insecure_tls = true

## Rotate Server keys when RotateAllServerKeys runs. Default true.
## Note the consequence: Periphery's public key is not permanent, so if you
## ever rebuild either side independently, re-read the key from Periphery's
## startup log rather than reusing an old one.
auto_rotate_keys = true

## The Periphery public key is NOT part of ServerConfig, so it is not managed
## by this sync and won't be reset by it. It stays as configured in the UI.

## Alerting — these fire into whatever Alerters you configure in the UI.
send_unreachable_alerts = true
send_cpu_alerts = true
send_mem_alerts = true
send_disk_alerts = true
cpu_warning = 90
mem_warning = 80
disk_warning = 85
