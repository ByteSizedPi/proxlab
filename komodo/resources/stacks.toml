## Stacks — the workloads Komodo deploys.
##
##
## ── Directory / tag taxonomy ──────────────────────────────────────────────
##
## Two independent axes, kept in sync by convention, not by anything Komodo
## enforces:
##
##   directory   stacks/<category>/<name>/   keeps the repo browsable as the
##               service count grows. Purely cosmetic — Komodo only cares
##               about the `run_directory` string below, so this could be any
##               layout. Categories: media, platform, apps.
##
##   tags        Komodo's actual grouping mechanism — flat, multi-select
##               filtering across the whole UI (dashboard, resource lists),
##               not a folder tree. Every stack gets its category as the
##               first tag, plus zero or more of these to narrow further:
##
##                 media     + arr          acquisition/automation
##                                           (prowlarr, radarr, sonarr,
##                                            bazarr, qbittorrent, tdarr)
##                           + streaming    consumption
##                                           (jellyfin, plex, seerr)
##                 platform  + ingress      traefik, cloudflared
##                           + security     authelia, crowdsec,
##                                           docker-socket-proxy
##                           + monitoring   netdata, scrutiny, uptime-kuma,
##                                           ntfy
##                 apps      (no secondary tag needed yet — homepage, immich)
##
## A stack always carries its category tag even when a secondary tag also
## applies, so filtering by "media" alone still finds everything media-
## related regardless of arr vs streaming.
##
## ── The env layering, and why it's ordered this way ──────────────────────
##
## Komodo passes files to `docker compose` as repeated --env-file flags:
##
##   env_file_path        -> komodo.env   (Komodo WRITES this; the ONLY file
##                                         [[VARIABLE]] / [[SECRET]] gets
##                                         interpolated into. Gitignored.)
##   additional_env_files -> ../common.env, <stack>.env   (committed, plain)
##
## ⚠️  Since v1.16.12, additional_env_files OVERRIDE env_file_path on key
## conflicts — Komodo's own managed file has the LOWEST precedence. That is
## backwards from what you'd expect, and it is only safe here because the key
## sets are disjoint by design: secrets exist solely in komodo.env, plain
## config solely in the committed files. Never define the same key in both.
##
## ✅ `../common.env` reaches above run_directory, and this was verified
## working on app-prod 2026-07-30 — Periphery resolved it and the container
## came up with PUID/PGID/TZ from common.env and CONFIG_ROOT substituted into
## the bind mount. No need for the flatter repo-root form.
##
## For reference, if a future Komodo version tightens this, the equivalent is:
##     run_directory = "stacks"
##     file_paths = ["media/prowlarr/compose.yaml"]
##     additional_env_files = ["common.env", "media/prowlarr/prowlarr.env"]
## Bind mounts are unaffected either way — compose.yaml uses absolute
## ${CONFIG_ROOT} paths, not paths relative to the run directory.
##
## ⚠️ The category subdirectory adds a nesting level, so reaching
## `common.env` from `run_directory` takes TWO `../`, not one — easy to get
## wrong when copy-pasting a new stack block. `stacks/<category>/<name>` is
## three segments below the repo root; `common.env` sits at `stacks/`, two
## segments up from `<name>`.

[[stack]]
name = "prowlarr"
tags = ["media", "arr"]
[stack.config]
server = "app-prod"

# --- Source ---
repo = "ByteSizedPi/proxlab"
branch = "main"
run_directory = "stacks/media/prowlarr"
file_paths = ["compose.yaml"]

# --- Environment ---
env_file_path = "komodo.env"
additional_env_files = ["../../common.env", "prowlarr.env"]

# --- Automation ---
# No per-stack webhook. Git-driven deploys come from the single "gitops"
# procedure (see procedures.toml), which syncs then batch-deploys every stack
# whose contents changed. One webhook for the repo, not one per service.
webhook_enabled = false
# Redeploy when a newer image digest appears upstream. Independent of git.
auto_update = true
poll_for_updates = true

# --- Pre-deploy: create the shared `media` network ---
#
# Same idempotent inspect-or-create pattern the traefik stack uses for
# `ingress` (see that stack's comment for the full "why"). Prowlarr owns
# `media` because it's the first consumer — FlareSolverr and qBittorrent join
# it below, Sonarr/Radarr will too.
[stack.config.pre_deploy]
path = ""
command = "docker network inspect media >/dev/null 2>&1 || docker network create media"
shell_mode = true


