## Stacks — the workloads Komodo deploys.
##
##
## ── The env layering, and why it's ordered this way ──────────────────────
##
## Komodo passes files to `docker compose` as repeated --env-file flags:
##
##   env_file_path        -> komodo.env   (Komodo WRITES this; the ONLY file
##                                         [[VARIABLE]] / [[SECRET]] gets
##                                         interpolated into. Gitignored.)
##   additional_env_files -> ../common.env, <stack>.env   (committed, plain)
##
## ⚠️  Since v1.16.12, additional_env_files OVERRIDE env_file_path on key
## conflicts — Komodo's own managed file has the LOWEST precedence. That is
## backwards from what you'd expect, and it is only safe here because the key
## sets are disjoint by design: secrets exist solely in komodo.env, plain
## config solely in the committed files. Never define the same key in both.
##
## ✅ `../common.env` reaches above run_directory, and this was verified
## working on app-prod 2026-07-30 — Periphery resolved it and the container
## came up with PUID/PGID/TZ from common.env and CONFIG_ROOT substituted into
## the bind mount. No need for the flatter repo-root form.
##
## For reference, if a future Komodo version tightens this, the equivalent is:
##     run_directory = "stacks"
##     file_paths = ["prowlarr/compose.yaml"]
##     additional_env_files = ["common.env", "prowlarr/prowlarr.env"]
## Bind mounts are unaffected either way — compose.yaml uses absolute
## ${CONFIG_ROOT} paths, not paths relative to the run directory.

[[stack]]
name = "prowlarr"
tags = ["media", "arr"]
[stack.config]
server = "app-prod"

# --- Source ---
repo = "ByteSizedPi/proxlab"
branch = "main"
run_directory = "stacks/prowlarr"
file_paths = ["compose.yaml"]

# --- Environment ---
env_file_path = "komodo.env"
additional_env_files = ["../common.env", "prowlarr.env"]

# --- Automation ---
# No per-stack webhook. Git-driven deploys come from the single "gitops"
# procedure (see procedures.toml), which syncs then batch-deploys every stack
# whose contents changed. One webhook for the repo, not one per service.
webhook_enabled = false
# Redeploy when a newer image digest appears upstream. Independent of git.
auto_update = true
poll_for_updates = true


[[stack]]
name = "cloudflared"
tags = ["platform", "ingress"]
[stack.config]
server = "app-prod"

# --- Source ---
repo = "ByteSizedPi/proxlab"
branch = "main"
run_directory = "stacks/cloudflared"
file_paths = ["compose.yaml"]

# --- Environment ---
# This is where the tunnel token enters. CF_TUNNEL_TOKEN is a Komodo Variable
# with "Secret" enabled; Komodo resolves [[CF_TUNNEL_TOKEN]] and writes the
# real value into komodo.env in the run directory at deploy time. The token
# never exists in this repo, and Komodo masks it in the UI and deploy logs.
environment = """
TUNNEL_TOKEN=[[CF_TUNNEL_TOKEN]]
"""
env_file_path = "komodo.env"
additional_env_files = ["../common.env", "cloudflared.env"]

# --- Automation ---
# Deployed by the "gitops" procedure like everything else — its `*` pattern
# includes this stack on purpose, so tunnel config changes still ship. Note
# that redeploying this cuts the connection the triggering webhook arrived
# over; see the warning at the foot of procedures.toml.
webhook_enabled = false
auto_update = true
poll_for_updates = true

## ── Komodo Core is deliberately NOT here ────────────────────────────────
##
## Core and Periphery are updated by scripts/update-komodo.sh, driven by
## komodo-update.timer on app-prod. Komodo does not manage Komodo.
##
## That was tried, on 2026-08-01, and removed the same day. Core's compose.env
## holds the Mongo password, so it can't come from a Komodo Variable (those
## live in the database that password unlocks). That forces `files_on_host`,
## which reads a clone nothing refreshes, which needs a Repo resource to
## refresh it, which then fails anyway:
##
##   fatal: detected dubious ownership in repository at '/home/jj/proxlab'
##
## because Periphery runs as root against a jj-owned clone. Three layers of
## machinery, one more override needed, to update a single container — and it
## also created a drift window between Core and Periphery that a shell script
## closes for free by updating both in one pass.
##
## The `auto_update` on the stacks above still applies to real workloads.
## Only the control plane is excluded, and only because it is the thing
## doing the deploying.
