## Stacks — the workloads Komodo deploys.
##
##
## ── The env layering, and why it's ordered this way ──────────────────────
##
## Komodo passes files to `docker compose` as repeated --env-file flags:
##
##   env_file_path        -> komodo.env   (Komodo WRITES this; the ONLY file
##                                         [[VARIABLE]] / [[SECRET]] gets
##                                         interpolated into. Gitignored.)
##   additional_env_files -> ../common.env, <stack>.env   (committed, plain)
##
## ⚠️  Since v1.16.12, additional_env_files OVERRIDE env_file_path on key
## conflicts — Komodo's own managed file has the LOWEST precedence. That is
## backwards from what you'd expect, and it is only safe here because the key
## sets are disjoint by design: secrets exist solely in komodo.env, plain
## config solely in the committed files. Never define the same key in both.
##
## ✅ `../common.env` reaches above run_directory, and this was verified
## working on app-prod 2026-07-30 — Periphery resolved it and the container
## came up with PUID/PGID/TZ from common.env and CONFIG_ROOT substituted into
## the bind mount. No need for the flatter repo-root form.
##
## For reference, if a future Komodo version tightens this, the equivalent is:
##     run_directory = "stacks"
##     file_paths = ["prowlarr/compose.yaml"]
##     additional_env_files = ["common.env", "prowlarr/prowlarr.env"]
## Bind mounts are unaffected either way — compose.yaml uses absolute
## ${CONFIG_ROOT} paths, not paths relative to the run directory.

[[stack]]
name = "prowlarr"
tags = ["media", "arr"]
[stack.config]
server = "app-prod"

# --- Source ---
repo = "ByteSizedPi/proxlab"
branch = "main"
run_directory = "stacks/prowlarr"
file_paths = ["compose.yaml"]

# --- Environment ---
env_file_path = "komodo.env"
additional_env_files = ["../common.env", "prowlarr.env"]

# --- Automation ---
# No per-stack webhook. Git-driven deploys come from the single "gitops"
# procedure (see procedures.toml), which syncs then batch-deploys every stack
# whose contents changed. One webhook for the repo, not one per service.
webhook_enabled = false
# Redeploy when a newer image digest appears upstream. Independent of git.
auto_update = true
poll_for_updates = true


[[stack]]
name = "cloudflared"
tags = ["platform", "ingress"]
[stack.config]
server = "app-prod"

# --- Source ---
repo = "ByteSizedPi/proxlab"
branch = "main"
run_directory = "stacks/cloudflared"
file_paths = ["compose.yaml"]

# --- Environment ---
# This is where the tunnel token enters. CF_TUNNEL_TOKEN is a Komodo Variable
# with "Secret" enabled; Komodo resolves [[CF_TUNNEL_TOKEN]] and writes the
# real value into komodo.env in the run directory at deploy time. The token
# never exists in this repo, and Komodo masks it in the UI and deploy logs.
environment = """
TUNNEL_TOKEN=[[CF_TUNNEL_TOKEN]]
"""
env_file_path = "komodo.env"
additional_env_files = ["../common.env", "cloudflared.env"]

# --- Automation ---
# Deployed by the "gitops" procedure like everything else — its `*` pattern
# includes this stack on purpose, so tunnel config changes still ship. Note
# that redeploying this cuts the connection the triggering webhook arrived
# over; see the warning at the foot of procedures.toml.
webhook_enabled = false
auto_update = true
poll_for_updates = true


## ── Komodo Core itself ───────────────────────────────────────────────────
##
## This one is deliberately NOT a git-mode stack, unlike everything above.
##
## Core's compose.env holds the Mongo password Core needs in order to reach
## the database. A git-mode stack would have to source that from a Komodo
## Variable — but Variables live IN that same database, so Core would need
## the database to learn how to reach the database. Circular.
##
## So: the repo is cloned to a fixed path on app-prod, compose.env and
## core.config.toml are written there by hand once, and Komodo points at
## those files in place via files_on_host. Redeploying still works, and
## still restarts Core, because Periphery is a systemd unit outside this
## stack — that separation is the whole reason Core can manage itself.
##
## ⚠️ files_on_host reads a clone that git-mode stacks would keep fresh for
## themselves but nothing updates here. The `proxlab` Repo resource plus the
## gitops procedure's pull stage exist solely to fix that; without them this
## stack pins Core to whatever commit was checked out the day it was made,
## while still reporting every deploy as a success. See repos.toml.

[[stack]]
name = "komodo-core"
tags = ["platform"]
[stack.config]
server = "app-prod"
files_on_host = true
run_directory = "/home/jj/proxlab/komodo"
file_paths = ["compose.yaml"]
# No env_file_path: compose.yaml already does `env_file: ./compose.env`,
# and Komodo must not overwrite that file.
# No webhook of its own, like every other stack — but note this one IS
# matched by the gitops procedure's `*` pattern. A push that changes
# komodo/compose.yaml therefore restarts Core *during* the procedure run that
# is deploying it, which kills the run partway through: remaining update
# records are lost and any sibling deploy dispatched later in the same stage
# may not happen. Periphery survives and completes what it was already told
# to do, and the 15-minute schedule reconciles whatever was missed. Treat a
# failed-looking run after a Core change as expected, not as a fault.
webhook_enabled = false

# Core updates ITSELF. That sounds reckless and would be, if Periphery were
# in this stack — Core would kill the agent mid-deploy. Periphery is a
# systemd unit on the host, so it survives Core being torn down and
# replaced, finishes the compose command, and Core comes back on the new
# image. This is the entire payoff of keeping them separate.
#
# Pairs with COMPOSE_KOMODO_IMAGE_TAG=2: a new 2.x digest appears upstream,
# Komodo notices within one poll interval and redeploys. Note this does NOT
# depend on the built-in "Global Auto Update" procedure, which is scheduled
# for 03:00 and would never fire on a machine that is switched off then.
#
# Expect the deploy log to look like a failure — the UI disconnects because
# the thing reporting is the thing restarting. Verify with `docker ps`.
auto_update = true
poll_for_updates = true
