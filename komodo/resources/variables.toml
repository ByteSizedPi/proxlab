## Variables — values Komodo itself interpolates as [[NAME]].
##
## Deliberately empty. See "When to use this file" below before adding
## anything, because the obvious use is the wrong one.
##
## ⚠️ Nothing here applies unless the Resource Sync has
## `include_variables = true`. Komodo gates Variables and User Groups behind
## separate opt-in flags, both false by default. With it off the file is
## fetched and parsed successfully and then produces zero variables, with no
## error and no warning — it simply looks like the file was ignored.
##
## ⚠️ NEVER put a secret in this file. It is committed to a public GitHub
## repo, so anything declared here is world-readable.

## ── Single source of truth ────────────────────────────────────────────────
##
## TZ, CONFIG_ROOT and DATA_ROOT used to be declared here AND in
## stacks/common.env. Deploying prowlarr on 2026-07-30 showed the Komodo
## Variables were entirely unused: the container took its values from
## common.env, because the compose file uses ${CONFIG_ROOT} — shell
## substitution from --env-file — not [[CONFIG_ROOT]], which is Komodo's own
## interpolation. Two mechanisms, only one of them wired up.
##
## Duplicating them bought nothing and risked silent drift, so they were
## removed. The rule now:
##
##   non-secret config  ->  stacks/common.env and stacks/<app>.env
##                          (committed, and testable with plain
##                          `docker compose --env-file`)
##
##   secrets            ->  Komodo UI > Settings > Variables, "Secret" on
##                          or komodo/core.config.toml under [secrets]
##                          (never in git)
##
## ── When to use this file ─────────────────────────────────────────────────
##
## Only for NON-SECRET values that Komodo must interpolate itself, where an
## env file can't reach — resources with no compose file of their own, such
## as Procedures, Alerters, or Builds. If a value ends up in a container's
## environment, it belongs in an env file instead.
