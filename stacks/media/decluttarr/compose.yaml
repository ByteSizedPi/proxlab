services:
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Consumed by the `!ENV` tags in configs/config.yaml, NOT by decluttarr
      # directly. Both halves are required: Komodo substitutes these into
      # komodo.env (see komodo/resources/stacks.toml) AND they have to be
      # injected into the container here. Same pattern as recyclarr and
      # cloudflared.
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
    volumes:
      # A DIRECTORY, not `./configs/config.yaml:/app/config/config.yaml`.
      #
      # Learned the hard way on the recyclarr stack, 2026-08-03: a single-file
      # bind mount pins that file's inode at container creation, and git
      # replaces files rather than rewriting them. After Komodo pulls, the host
      # holds the new config while the container still reads the old inode,
      # silently, with no error anywhere. See recyclarr/compose.yaml for the
      # full write-up. A directory inode is stable, so a pull is picked up.
      #
      # Read-only because decluttarr only ever reads this. It keeps no state.
      - ./configs:/app/config:ro

      # ── Media, READ-ONLY, for the detect_deletions job ────────────────────
      #
      # Sonarr scans for deletions every 12h and Radarr every 24h. Delete an
      # episode in Jellyfin or Plex inside that window and the *arr still
      # thinks it is monitored, so it re-downloads the thing you just deleted.
      # detect_deletions watches the media folders and refreshes the item so
      # it gets unmonitored instead. This is the fix for JJ's "I deleted it
      # and it came back" complaint (see arr-stack-buildout memory).
      #
      # The mount path MUST be identical to what Sonarr and Radarr use, hence
      # ${DATA_ROOT}:/data and not a shortcut to the media subfolder. decluttarr
      # compares the literal paths the *arr APIs report (/data/media/tv,
      # /data/media/movies) against what it can see.
      #
      # `:ro` is deliberate and load-bearing. decluttarr only needs to know
      # whether a file still exists. Read-only means a bug in a deletion job
      # cannot reach a media file, which is the whole reason this mount was
      # left out when the stack was first written.
      - ${DATA_ROOT}:/data:ro

    # No `ports:` and no Traefik labels — decluttarr has no web UI at all. It
    # only talks OUT to Sonarr, Radarr and qBittorrent on its own timer.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # `media` only, for the same reason as recyclarr. Nothing calls into
      # decluttarr, so it never needs to be reachable through ingress.
      - media

networks:
  # Created by the prowlarr stack's pre_deploy hook — see prowlarr/compose.yaml
  # and komodo/resources/stacks.toml.
  media:
    external: true
