# Decluttarr V2 configuration.
#
# V2 moved instances and download clients OUT of environment variables and
# into this file. The old V1 `SONARR_URL` / `SONARR_API_KEY` env vars no
# longer configure anything. Source:
# https://github.com/ManiMatter/decluttarr#upgrading-from-v1-to-v2
#
# `!ENV NAME` reads an environment variable, which is how the API keys and the
# qBittorrent password stay OUT of this repo. The variables are Komodo
# secrets, injected by compose.yaml. Same split as recyclarr.
#
# ⚠️ This file is mounted as part of a DIRECTORY, not as a single file. See the
# volumes comment in ../compose.yaml before changing that.

general:
  log_level: INFO

  # Reviewed 2026-08-09: 72h of logs showed detect_deletions correctly
  # triggering on real Jellyfin/Plex deletions (Oppenheimer, KPop Demon
  # Hunters) and zero risky candidates from the other jobs. Flipped live.
  test_run: false

  # Minutes between runs. 10 is the upstream default.
  timer: 10

  # Every tracker in this setup is public — see the Prowlarr indexer list.
  # `remove` is the default for both, spelled out so the behaviour is visible
  # without reading upstream docs.
  private_tracker_handling: remove
  public_tracker_handling: remove

  # A torrent tagged "Keep" in qBittorrent is never touched by decluttarr.
  protected_tag: "Keep"

job_defaults:
  max_strikes: 3
  min_days_between_searches: 7
  max_concurrent_searches: 3

jobs:
  # Downloads that failed outright, and imports the *arr refused.
  remove_failed_downloads:
  remove_failed_imports:
    message_patterns:
      - "Not a Custom Format upgrade for existing*"
      - "Not an upgrade for existing*"
      - "*Found potentially dangerous file with extension*"
      - "Invalid video file*"
      - "No files found are eligible for import*"
      - "One or more episodes expected in this release were not imported or missing from the release"

  # Stuck in metadata-fetch, or the files vanished underneath the queue item.
  remove_metadata_missing:
  remove_missing_files:

  # In the download client but no longer wanted by any *arr.
  #
  # ⚠️ remove_orphans ships upstream with NO max_strikes (checked
  # src/settings/_jobs.py 2026-08-11: every other removal job below gets
  # job_defaults.max_strikes, this one is built as bare JobParams()). That
  # means one bad snapshot is a permanent, non-blocklisted deletion with no
  # chance to recover on the next cycle. pve-prod powers off overnight (see
  # homelab-constraints memory); every morning decluttarr restarts and its
  # first 1-2 cycles catch Sonarr/Radarr/qBittorrent still resyncing from
  # the cold boot, which this job read as "no longer wanted" and deleted
  # outright. Confirmed 2026-08-11: Cat in the Hat, Tenet, and most of
  # Common Side Effects season 1 were all removed within the first 20
  # minutes after a boot-triggered decluttarr restart. Setting max_strikes
  # here opts this job into the same strike counter remove_stalled already
  # uses, so a download has to look orphaned for 3 consecutive 10-minute
  # cycles (~30 min) before it is actually removed, instead of on the very
  # first look.
  remove_orphans:
    max_strikes: 3
  remove_unmonitored:

  # Stalled with no peers. Three strikes at a 10 minute timer means roughly
  # 30 minutes of nothing happening before it is dropped.
  remove_stalled:

  # Junk inside an otherwise valid release.
  #
  # ⚠️ This job turns on "Keep unselected files in .unwanted folder" in
  # qBittorrent, and it does so even while test_run is true. Observed
  # 2026-08-03. test_run suppresses removals, it is not a guarantee that
  # decluttarr changes nothing anywhere.
  remove_bad_files:

  # Stops a file deleted in Jellyfin or Plex from being re-downloaded before
  # Sonarr's 12h (Radarr's 24h) deletion scan notices. Needs the read-only
  # ${DATA_ROOT}:/data mount added to compose.yaml at the same time as this;
  # without it decluttarr logs "does not have access to this path" and the
  # job silently does nothing.
  detect_deletions:

  # Self-heal for anything that ends up with zero file — including whatever
  # remove_orphans / remove_stalled / remove_failed_* remove above. Added
  # 2026-08-11 after finding NEITHER Sonarr NOR Radarr runs any native
  # periodic "missing" search (checked both via GET /api/v3/system/task:
  # only Rss Sync, which catches a release only if it happens to show up in
  # the RSS feed while still relevant — not a systematic retry). Without
  # this, a removed download stays missing forever unless searched by hand.
  #
  # Deliberately NOT aggressive: uses job_defaults untouched
  # (max_concurrent_searches: 3, min_days_between_searches: 7), so at most 3
  # searches run at once and the same title is not re-searched for a week.
  # search_unmet_cutoff is the one left off below — it targets nearly the
  # whole library (anything under the WEB 1080p cutoff), not just zero-file
  # items, so the same conservative defaults would still mean a constant
  # background trickle of searches. search_missing only targets items with
  # no file at all, a set that shrinks as things succeed, so it does not
  # have that problem.
  search_missing:

  # ── Deliberately NOT enabled ──────────────────────────────────────────────
  #
  # remove_slow:       public trackers are often genuinely slow rather than
  #                    broken, and a low min_speed would drop downloads that
  #                    would have finished. Revisit with real numbers once
  #                    there is download history to look at.
  # remove_done_seeding: overlaps with Sonarr/Radarr's own "Remove Completed"
  #                    on the qBittorrent client, which is already on. Two
  #                    things deleting the same torrent is how you get
  #                    confusing gaps. Pick one, and it is already picked.
  # search_unmet_cutoff: fires searches across all 19 public indexers for
  #                    anything below the WEB 1080p cutoff, which is most of
  #                    the library. Revisit only with a deliberate, longer
  #                    min_days_between_searches than the 7-day default.

instances:
  sonarr:
    - base_url: "http://sonarr:8989"
      api_key: !ENV SONARR_API_KEY
  radarr:
    - base_url: "http://radarr:7878"
      api_key: !ENV RADARR_API_KEY

download_clients:
  qbittorrent:
    # `name` must match what Sonarr and Radarr call this client in their own
    # Settings > Download Clients page. Both were added as "qBittorrent".
    - base_url: "http://qbittorrent:8080"
      name: "qBittorrent"
      username: !ENV QBITTORRENT_USERNAME
      password: !ENV QBITTORRENT_PASSWORD
