services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none

    # No `ports:`, no Traefik labels. FlareSolverr is a service-to-service
    # dependency for Prowlarr's indexer requests, never a human-facing UI —
    # it stays on `media` only, reachable at http://flaresolverr:8191 from
    # anything else on that network.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - media

networks:
  # Created by the prowlarr stack's pre_deploy hook — see the network notes
  # in ../prowlarr/compose.yaml and komodo/resources/stacks.toml.
  media:
    external: true
