services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config:Z
      - ${DATA_ROOT}:/data:Z
      # RAM-backed transcode scratch space, not disk. Matches jjserver.
      - /dev/shm:/transcode
      # Logo files for custom.css, served at /web/branding/. Inside the web
      # root because Jellyfin serves nothing else without a plugin.
      - ./branding:/usr/share/jellyfin/web/branding:ro,Z
      # UI revamp, served at /web/ui/. JavaScript Injector loads
      # /web/ui/loader.js, which loads what ui/manifest.json lists. A
      # directory mount, so a Komodo pull is seen without a recreate. But a
      # push that only touches ui/ does not deploy: touch this file too, or
      # Deploy in Komodo (same trap as recyclarr's configs/).
      # 2026-11-03: touched to deploy the first UI release (ui/ only pushes
      # are not deployed, see above).
      - ./ui:/usr/share/jellyfin/web/ui:ro,Z
      # Dev copy of ui/, served at /web/ui-dev/. Not in git: ui/dev.sh on the
      # laptop rsyncs into it on every save. Only browsers in dev mode
      # (?uidev=1) load from here. See ui/README.md.
      - ${CONFIG_ROOT}/jellyfin-ui-dev:/usr/share/jellyfin/web/ui-dev:ro

    # No hardware transcode device passthrough (/dev/dri etc.) — not
    # confirmed available on pve-prod's VM, unlike jjserver's bare-metal
    # GPU. Software transcode until that's verified. See arr-stack-buildout
    # memory: "transcoding in the background" is Tdarr's job either way,
    # this only affects live playback transcodes Tdarr didn't pre-handle.
    #
    # No `ports:` block, same reasoning as prowlarr/compose.yaml — Traefik
    # reaches it over `ingress`.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      ingress: {}
      media: {}
      # The Cloudflare tunnel (public jellyfin.jjventer.co.za) reaches
      # Jellyfin here. See ../../platform/cloudflared/compose.yaml.
      #
      # Fixed address, because cloudflared holds 172.31.0.2. Without a fixed
      # address, Docker gives Jellyfin the first free one. On the 2026-11-07
      # boot Jellyfin started first and got 172.31.0.2. Then cloudflared failed
      # with "Address already in use", and the public route was down for 2 days.
      tunnel:
        ipv4_address: 172.31.0.3

    # ── Real client addresses, configured in Jellyfin, not here ──────────
    #
    # Traefik sets X-Forwarded-For correctly, but Jellyfin ignores it unless
    # the proxy is trusted. Until 2026-08-19 every session logged
    # `IP address: 172.22.0.8` — the Traefik container — so no access log
    # could tell the TV from the phone.
    #
    # Fixed in Jellyfin's own network config, which lives in the /config
    # volume and is NOT part of this repo:
    #
    #   KnownProxies        = ["traefik", "172.31.0.2"]
    #   LocalNetworkSubnets = ["10.0.0.0/24", "10.42.0.0/24",
    #                          "100.64.0.0/10", "172.22.0.0/16"]
    #
    # 172.31.0.2 is cloudflared on the `tunnel` network (2026-11-03). It is
    # trusted as a proxy but its subnet is NOT local, so internet viewers are
    # REMOTE. `admin` and `jj` have "allow remote connections" off, so they
    # cannot log in through the tunnel at all, only over the LAN or tailnet.
    #
    # Set via POST /System/Configuration/network, then a container restart.
    # Verified afterwards: a session from the laptop reports 10.42.0.145.
    #
    # ⚠️ LocalNetworkSubnets is not optional once KnownProxies is set. With it
    # empty, Jellyfin auto-detects local subnets from its OWN interfaces, which
    # inside the container are only the 172.x docker networks. The moment it
    # starts seeing real 10.x client addresses it would classify every LAN
    # client as REMOTE. Harmless today because both RemoteClientBitrateLimit
    # values are 0, but it would silently cap playback the day one is set.
    #
    # ⚠️ `traefik` is a hostname resolved on the `ingress` network at config
    # load. If the Traefik container is recreated with a new address while
    # Jellyfin keeps running, trust breaks until Jellyfin restarts. A container
    # IP was rejected here for the same reason, in reverse.

    # ── Plugins, also configured in Jellyfin, not here ───────────────────
    #
    # Plugin state lives in /config/data/plugins and is NOT part of this repo.
    # On 2026-09-22 the web UI layer changed to Jellyfin Enhanced 12.8.0.0
    # (repo https://raw.githubusercontent.com/n00bcodr/jellyfin-plugins/main/manifest.json).
    # It does the Seerr search/requests and the per-source ratings row.
    #
    # Disabled, not uninstalled, on that date:
    #   Home Screen Sections - its Seerr Discover rows loaded slowly and
    #                          broke the home page at the bottom of the scroll.
    #   Collection Sections  - built for ABI 10.11.11, running on 12.1.
    #   Media Bar            - disabled to test one UI plugin at a time.
    # Kept: File Transformation and Plugin Pages, which Jellyfin Enhanced uses.
    # Backup of the earlier state: /config/plugins-backup-2026-09-22.tgz.
    #
    # 2026-11-09: Media Bar (3.0.2.0, header slideshow) and Home Screen
    # Sections (3.0.4.0) enabled again, both built for 12.4. Home rows, in
    # order: Continue Watching/Next Up, Leaving Soon (ui/js), Recently Added
    # Movies/Series/Audiobooks, Because You Watched, Seerr requests, Upcoming
    # episodes/movies, Genre. Seerr Discover rows stay OFF (slow, see above).
    # Per-user overrides OFF, so every account and the TV get one layout.
    # Set in Jellyfin.Plugin.HomeScreenSections.xml (backup .bak-2026-11-09).
    # Collection Sections stays disabled.
    # Same day: "Group movies/shows into collections" OFF (it hid the shows of
    # "Leaving soon - Shows" from the Series list) and HDR tone mapping ON.
    #
    # 2026-10-11: Jellyfin Enhanced "Elsewhere" (the streaming-services panel
    # on an item page) set off: ElsewhereEnabled=false in
    # /config/data/plugins/configurations/Jellyfin.Plugin.JellyfinEnhanced.xml.
    # Backup next to it with the suffix .bak-2026-10-11.
    #
    # Theme: Catppuccin Frappé (Mocha until 2026-10-11), branded
    # "ByteSizedMedia". The CSS is in custom.css next to this file, pasted
    # into Dashboard > Branding.
    # Header and splash logo since 2026-10-11: branding/mark-frappe.svg. Komodo only
    # redeploys when THIS file changes, so a branding/ or custom.css change
    # needs an edit here too.
    # Jellyfin does not read custom.css. It does serve ./branding (above).
    # The server name is set in Dashboard > General, also not in this repo.

    labels:
      - "traefik.enable=true"
      # Jellyfin is the one service published in BOTH zones, and the reasons
      # differ per zone. See stacks/common.env for the split.
      #
      #   admin -> pve-prod's tailnet address. Watching from outside the house.
      #   home  -> pve-prod's LAN address. The TV cannot run Tailscale, and a
      #            high-bitrate remux should not pay WireGuard's encryption
      #            cost and 1280-byte MTU to cross a single LAN hop.
      #
      # The public zone, jellyfin.jjventer.co.za, does NOT go through Traefik.
      # It is a Cloudflare tunnel route straight to http://jellyfin:8096 over
      # the `tunnel` network (2026-11-03). See docs/ARCHITECTURE.md.
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${ADMIN_DOMAIN}`)"
      # A second router on the same container needs an explicit `.service`,
      # because naming a service below stops Traefik inferring one per router.
      - "traefik.http.routers.jellyfin-home.rule=Host(`jellyfin.${HOME_DOMAIN}`)"
      - "traefik.http.routers.jellyfin-home.service=jellyfin"
      # Since 2026-11-03 the LAN address reaches only the homesecure
      # entrypoint, so the home router must name it. Without this label the
      # router lands on websecure (the default) and the TV gets a 404.
      - "traefik.http.routers.jellyfin-home.entrypoints=homesecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      # On the admin router, entrypoints/tls/middlewares are deliberately
      # omitted — see the comment in prowlarr/compose.yaml.

networks:
  ingress:
    external: true
  # Created by prowlarr's pre_deploy hook — see prowlarr/compose.yaml and
  # komodo/resources/stacks.toml. Seerr reaches Jellyfin's API over this.
  media:
    external: true
  # Created by the jellyfin or cloudflared pre_deploy hook, see
  # komodo/resources/stacks.toml.
  tunnel:
    external: true
