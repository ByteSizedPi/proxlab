services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      # Default is @daily. Explicit here so the schedule is visible without
      # opening the image docs.
      - CRON_SCHEDULE=@daily
      # Komodo writes these into komodo.env (see stacks.toml), which makes
      # them available for substitution here — but substitution alone does
      # not inject them into the container. Both halves are required, same
      # pattern as cloudflared's TUNNEL_TOKEN.
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      # Writable — this is where Recyclarr caches its clone of the
      # TRaSH-Guides and config-templates repos, plus its own logs/state.
      - ${CONFIG_ROOT}/recyclarr:/config:Z
      # The actual sync definition, version-controlled and read-only. This
      # is what makes a change here a `git push`, not a manual edit on the
      # host — same pattern as every other stack in this repo.
      #
      # ⚠️ A DIRECTORY, NOT `./configs/recyclarr.yml:/config/recyclarr.yml`.
      #
      # It was the single-file form until 2026-08-03 and that form is a trap.
      # A file bind mount pins the file's INODE at container creation. Git
      # replaces a file rather than rewriting it in place, so after Komodo
      # pulled a new recyclarr.yml the host had the new content while the
      # container still read the old inode. Measured that day: `grep -c` gave
      # 1 on the host and 0 inside the container, and Recyclarr cheerfully
      # synced the previous day's config with no error anywhere.
      #
      # Restarting does NOT fix it. The mount is resolved when the container
      # is created, so it needs a recreate. A directory mount has no such
      # problem: the directory inode is stable and new files inside it are
      # seen immediately, so a pull is picked up by the next sync run.
      #
      # Recyclarr loads /config/recyclarr.yml AND every *.yml under
      # /config/configs, so moving the file into configs/ needs no CLI flag.
      # See `recyclarr sync --help`, the -c option.
      - ./configs:/config/configs:ro

      # ⚠️ SECOND HALF OF THE SAME TRAP: a push that only touches files under
      # configs/ still does not DEPLOY. Stage 2 of the gitops procedure is
      # BatchDeployStackIfChanged, and "changed" is decided from the compose
      # file named in this stack's `file_paths` (komodo/resources/stacks.toml).
      # Komodo therefore never pulls, and the host file never changes either.
      #
      # Verified 2026-08-03: commit 6f9ae38 sat on origin for 30 minutes
      # across two gitops runs with the clone untouched. It only moved once a
      # commit modified this compose file.
      #
      # So a config-only change needs one of:
      #   - any edit to this compose file in the same commit, or
      #   - a manual Deploy on the recyclarr stack in the Komodo UI.
      # Then force the sync, since the container otherwise waits for
      # CRON_SCHEDULE:  docker exec recyclarr recyclarr sync
      #
      # The traefik stack mounts ./dynamic the same way. Its file provider
      # hot-reloads, so it never had the inode half of this problem, but the
      # deploy half applies there too.
      #
      # 2026-08-14: this line touched on purpose, to force the deploy that
      # the profile rename in configs/recyclarr.yml needs (see the comment
      # above). No functional change here.

    # No `ports:`, no Traefik labels — Recyclarr has no UI, it only talks
    # OUT to Sonarr/Radarr over `media` on its own schedule.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - media

networks:
  # Created by the prowlarr stack's pre_deploy hook — see prowlarr/compose.yaml
  # and komodo/resources/stacks.toml. Recyclarr reaches Sonarr/Radarr by
  # container name (http://sonarr:8989, http://radarr:7878) over this.
  media:
    external: true
