services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      # Default is @daily. Explicit here so the schedule is visible without
      # opening the image docs.
      - CRON_SCHEDULE=@daily
      # Komodo writes these into komodo.env (see stacks.toml), which makes
      # them available for substitution here — but substitution alone does
      # not inject them into the container. Both halves are required, same
      # pattern as cloudflared's TUNNEL_TOKEN.
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      # Writable — this is where Recyclarr caches its clone of the
      # TRaSH-Guides and config-templates repos, plus its own logs/state.
      - ${CONFIG_ROOT}/recyclarr:/config:Z
      # The actual sync definition, version-controlled and read-only. This
      # is what makes a change here a `git push`, not a manual edit on the
      # host — same pattern as every other stack in this repo.
      #
      # ⚠️ A PUSH THAT ONLY TOUCHES recyclarr.yml DOES NOT DEPLOY. Verified
      # 2026-08-03: commit 6f9ae38 rewrote recyclarr.yml and sat on origin
      # for 31 minutes across two `gitops` runs while
      # /etc/komodo/stacks/recyclarr/.../recyclarr.yml kept its old mtime.
      #
      # Why: stage 2 of the gitops procedure is BatchDeployStackIfChanged,
      # and "changed" means the compose file named in this stack's
      # `file_paths` (see komodo/resources/stacks.toml). A side-car mounted
      # from the repo is invisible to that check, so Komodo never pulls and
      # the container keeps reading the previous file forever.
      #
      # Two ways out. Touch this compose file in the same commit, which is
      # what this comment block did. Or redeploy the stack by hand in the
      # Komodo UI. Then force the sync, because the container only reads
      # recyclarr.yml on its CRON_SCHEDULE:
      #   docker exec recyclarr recyclarr sync
      #
      # The traefik stack has the same shape (./dynamic:/dynamic:ro), so a
      # middleware-only or TLS-only edit there needs the same treatment.
      - ./recyclarr.yml:/config/recyclarr.yml:ro

    # No `ports:`, no Traefik labels — Recyclarr has no UI, it only talks
    # OUT to Sonarr/Radarr over `media` on its own schedule.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - media

networks:
  # Created by the prowlarr stack's pre_deploy hook — see prowlarr/compose.yaml
  # and komodo/resources/stacks.toml. Recyclarr reaches Sonarr/Radarr by
  # container name (http://sonarr:8989, http://radarr:7878) over this.
  media:
    external: true
