# Generated from `recyclarr config create -t web-1080p -t hd-bluray-web` on
# pve-prod 2026-08-02, run against the real TRaSH-Guides + config-templates
# repos so every trash_id below is verified straight from the tool — not
# hand-typed. Only base_url/api_key and the language exclusion were edited
# by hand afterward. See arr-stack-buildout memory for the full reasoning.
#
# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# ── Scope: what this file overwrites, and what it leaves alone ────────────
#
# Recyclarr writes exactly three things on every run, and only for the two
# profiles named below:
#   1. Settings > Quality        — the whole size table for the listed type
#   2. Settings > Custom Formats — the formats listed here, and their scores
#   3. The quality profile itself — qualities, order, cutoff, scores, and
#      (Radarr only) the Language field
#
# It does NOT touch: root folders, Media Management, naming schemes,
# download clients, indexers, delay profiles, tags, Connect entries, or any
# quality profile whose name is not listed here. Configure all of those in
# each app's UI and Recyclarr will leave them alone.
#
# Two consequences worth knowing before editing a profile by hand:
#   - Editing "WEB-1080p" or "HD Bluray + WEB" in the UI lasts until the next
#     nightly run. Change this file instead, then push.
#   - `reset_unmatched_scores: enabled: true` sets to 0 the score of any
#     custom format inside those two profiles that this file does not list.
#     To keep a hand-added format scored, add it to this file with its score.
#     A SECOND profile (the language-exception one, see below) is untouched,
#     so per-series exceptions are safe to build in the UI.

sonarr:
  web-1080p:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    # Recyclarr never deletes a custom format that this file stops listing.
    # `false` is already the default. It is written out so nobody turns it on
    # without reading what it does. See the "scope" comment at the top.
    delete_old_custom_formats: false

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

        # The guide profile enables ONE quality: WEB 1080p. That is strict.
        # A show with no 1080p WEB release downloads nothing at all, which is
        # the normal case for older and back-catalogue series. JJ asked for
        # fallbacks instead (2026-08-03), so the list is overridden here.
        #
        # ⚠️ A `qualities` list REPLACES the guide list, it does not merge.
        # Every quality that must stay enabled has to be repeated below.
        # Anything absent is disabled, which is how 2160p stays out.
        #
        # Order is preference, best first. `until_quality` is still WEB 1080p,
        # so a 720p or HDTV grab is upgraded as soon as a 1080p WEB release
        # appears. Quality tier says nothing about whether a release is bad —
        # the LQ and Upscaled custom formats below score -10000 and block
        # those at any resolution.
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBRip-1080p
              - WEBDL-1080p
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities:
              - WEBRip-720p
              - WEBDL-720p
          - name: Bluray-720p
          - name: HDTV-720p
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
          select:
            - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        # No `select:` here. Both formats in this group (HD Streaming Boost,
        # UHD Streaming Boost) are marked `required` in the guide, and
        # required formats are always included. Naming them made Recyclarr
        # warn "Selecting required CF ... is redundant" on every run.
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
        # JJ's language filtering ask, 2026-08-02: default profile is
        # English-audio only. Sonarr has no native language field (unlike
        # Radarr), so this custom-format group is the correct mechanism —
        # see https://trash-guides.info/Sonarr/Tips/How-to-setup-language-custom-formats/
        # Score comes from the guide itself, not hand-set here.
        #
        # Per-item exceptions (e.g. an Afrikaans-language show, anime) need
        # a SECOND quality profile without this group, assigned to just
        # those series in Sonarr's UI. Not built yet — do this once JJ has
        # an actual title to assign it to, see arr-stack-buildout memory.
        #
        # `select` adds NON-DEFAULT formats from a group. Formats the guide
        # marks `default: true` come in whether or not they are listed, so
        # unwanted ones need `exclude`. Deleting them in Sonarr does nothing:
        # the next sync recreates them (measured 2026-08-03).
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
          select:
            - 69aa1e159f97d860440b04cd6d590c4f  # Language: Not English
          exclude:
            # `Language: Not Original` is a default member of this group and
            # scores -10000. It rejects a release whose audio is not the
            # show's ORIGINAL language, which kills an English dub of an
            # anime — exactly the case JJ wants to keep available through a
            # second profile. `Language: Not English` alone is the rule he
            # asked for, so the original-language one is excluded.
            - ae575f95ab639ba5d15f663bf019e3e8  # Language: Not Original

      skip: []

radarr:
  hd-bluray-web:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    # Same reasoning as the Sonarr instance above.
    delete_old_custom_formats: false

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

        # The guide profile enables three qualities: Bluray-1080p, WEB 1080p
        # and Bluray-720p. WEB 720p is added below (JJ, 2026-08-03) because a
        # streaming-only title that never got a Bluray has no other fallback.
        #
        # ⚠️ A `qualities` list REPLACES the guide list, it does not merge.
        # Every quality that must stay enabled has to be repeated below.
        # Anything absent is disabled, which is how 2160p stays out.
        #
        # HDTV is deliberately absent, unlike the Sonarr profile. An HDTV
        # release of a film is a broadcast rip, usually cut for runtime and
        # content. For a TV episode it is a normal source.
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBRip-1080p
              - WEBDL-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBRip-720p
              - WEBDL-720p
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
          select:
            - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select:
            - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
            - cae4ca30163749b891686f95532519bd  # AV1
            - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
            - ed38b889b31be83fda192888e2286d83  # BR-DISK
            - 0a3f082873eb454bde444150b70253cc  # Extras
            - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
            - 90a6f9a284dff5103f6346090e6280c8  # LQ
            - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
            - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
            - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled

      skip: []
    # Radarr HAS a native per-movie language field, unlike Sonarr — no
    # custom-format hack needed. Recyclarr DOES sync this field: the guide
    # profile carries `"language": "Original"` and Recyclarr applies it.
    # Do not set it by hand in Radarr's UI, the next sync overwrites it.
    # Recyclarr has no YAML key to override the value either.
    #
    # "Original" means the film's own language, not English. An English film
    # therefore rejects an Italian dub, and a French film still accepts its
    # French audio. That matches JJ's ask better than a fixed "English".
