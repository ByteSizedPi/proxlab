services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      # Force IPv4 for outbound DNS. This is the Node equivalent of the
      # DOTNET_SYSTEM_NET_DISABLEIPV6 already set on prowlarr/sonarr/radarr,
      # and it is here for the same reason.
      #
      # The docker bridge networks have no IPv6 route, but TMDb's image CDN
      # (image.tmdb.org -> tmdb-image-prod.b-cdn.net) publishes BOTH A and
      # AAAA records. Node 22 defaults its DNS result order to `verbatim`, so
      # it tries whatever the resolver returned first. When that is the AAAA,
      # the connection dies with ENETUNREACH.
      #
      # Measured inside the container, 2026-08-03:
      #   IPv4 -> 200 in 769ms
      #   IPv6 -> ENETUNREACH in 25ms
      #
      # The symptom was a Seerr UI full of broken posters, plus repeated
      # "[TMDB] Failed to fetch TV show details" and "Failed to proxy image"
      # in /app/config/logs/seerr-*.log. Requests to Sonarr still worked,
      # because those go to a container name on the media network and never
      # touch IPv6 — which is what made it look like a Seerr bug rather than
      # a network one.
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config:Z
      # No DATA_ROOT mount — Seerr never touches media files directly, only
      # the Sonarr/Radarr/Jellyfin/Plex APIs over `media`.

    # No `ports:` block, same reasoning as prowlarr/compose.yaml.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # This image has no curl, only wget — confirmed by inspecting jjserver
      # rather than assuming (its other *arr-adjacent containers all have
      # curl, this one doesn't).
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ingress
      - media

    labels:
      - "traefik.enable=true"
      # Two zones, same container. Added to the home zone 2026-08-31.
      #
      #   admin -> pve-prod's tailnet address. Requesting from outside the
      #            house, and from a phone on mobile data.
      #   home  -> pve-prod's LAN address. Household members request titles
      #            from devices that do not run Tailscale.
      #
      # Seerr is the second service in both zones, after jellyfin. The reason
      # is the same in both cases: people other than JJ use it, and those
      # people are not on the tailnet. Do NOT copy this to the *arr apps —
      # those are single-operator and belong in the admin zone only.
      - "traefik.http.routers.seerr.rule=Host(`seerr.${ADMIN_DOMAIN}`)"
      # A second router on the same container needs an explicit `.service`,
      # because naming a service below stops Traefik inferring one per router.
      - "traefik.http.routers.seerr-home.rule=Host(`seerr.${HOME_DOMAIN}`)"
      - "traefik.http.routers.seerr-home.service=seerr"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      # entrypoints/tls/middlewares deliberately omitted — see the comment in
      # prowlarr/compose.yaml, same reasoning applies here.

networks:
  ingress:
    external: true
  # Created by prowlarr's pre_deploy hook — see prowlarr/compose.yaml and
  # komodo/resources/stacks.toml. Seerr talks to Sonarr, Radarr, Jellyfin
  # and Plex over this during its own setup wizard and afterward.
  media:
    external: true
