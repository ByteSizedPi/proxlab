services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      # Injected by Komodo into komodo.env from the CF_TUNNEL_TOKEN secret
      # Variable. Never appears in this repo. See ../../../komodo/resources/stacks.toml.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    extra_hosts:
      # The tunnel's job is to reach Komodo Core, which publishes 9120 on the
      # HOST. Inside this container "localhost" is the container itself, so
      # the Cloudflare-side ingress rule must target host.docker.internal.
      - "host.docker.internal:host-gateway"

    # ── Cloudflare-side config (dashboard, not this file) ──────────────────
    #
    # This tunnel is remotely managed, so routes live in the Zero Trust
    # dashboard rather than a local config.yml. The public hostname is:
    #
    #   Hostname : hooks.jjventer.co.za
    #   Path     : ^/listener/.*
    #   Service  : http://host.docker.internal:9120
    #
    # ⚠️ The path is a Go regex matched against the FULL path INCLUDING the
    # leading slash. `listener/.*` matches nothing and every request falls
    # through to a generic Cloudflare 404 — which looks identical to a
    # correctly-blocked request, so it's easy to mistake for success.
    # Anchor it with ^ and include the slash.
    #
    # ⚠️ This single rule is the entire security boundary. Only /listener/*
    # is publicly reachable; the Komodo UI and API stay LAN-only. Widening it
    # to `.*` would publish the whole of Komodo to the internet behind
    # nothing but a login form.
    #
    # Verify from OUTSIDE the LAN after any change:
    #
    #   curl -so /dev/null -w '%{http_code}\n' https://hooks.jjventer.co.za/
    #     -> 404  (UI not exposed — this one is correct)
    #
    #   curl -so /dev/null -w '%{http_code}\n' -X POST \
    #     https://hooks.jjventer.co.za/listener/github/procedure/<ID>/main
    #     -> 401  (route alive; the unsigned request is correctly rejected)
    #
    # ⚠️ Do NOT probe the bare /listener/ path. It returns 404 even when
    # everything is working — verified 2026-08-01, and the response carries
    # `server: cloudflare`, so it is Cloudflare's own 404 rather than Komodo's.
    # The bare path does not match this tunnel's ingress rule. An earlier
    # version of this comment said "/listener/ -> NOT 404" as the health
    # check, which reports a healthy pipeline as broken.
    #
    # Probe a REAL webhook route instead. Get the id with:
    #   docker exec komodo-mongo-1 mongosh --quiet -u <user> -p <pass> \
    #     --authenticationDatabase admin komodo \
    #     --eval 'print(db.Procedure.findOne({name:"gitops"})._id)'
    #
    # ⚠️ Core rate-limits these probes to 5 per 15 seconds per source IP, and
    # a throttled response looks like a routing failure. Space them out.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

    # ⚠️ NO HEALTHCHECK — a deliberate, documented exception to the repo-wide
    # convention in ../../../README.md.
    #
    # cloudflare/cloudflared is distroless: no shell, no curl, no wget. There
    # is nothing in the image capable of probing the tunnel, and Docker's
    # healthcheck can only run binaries the image already contains.
    #
    # Faking one (`CMD true`) would be worse than none — it reports healthy
    # unconditionally, which is exactly the false-confidence failure the
    # convention exists to prevent.
    #
    # Health is observable elsewhere instead:
    #   - Cloudflare Zero Trust dashboard shows tunnel connection status
    #   - `docker logs cloudflared` reports registered connections
    #   - the webhook simply stops firing, which GitHub's "Recent Deliveries"
    #     tab surfaces directly
    #
    # Revisit if Cloudflare ever ships a non-distroless tag.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
