# Gatus checks. Three groups:
#   Backends: each app straight on the ingress network. This catches a dead
#     app even when Authentik answers in front of it.
#   Edge:     the HTTPS names through Traefik, plus the TLS certificate
#     expiry. Traefik renews 30 days before expiry, so an alert at 14 days
#     means renewal is broken.
#   Public:   Jellyfin through the Cloudflare tunnel, and AdGuard DNS.
#
# A check alerts after 3 failures in a row (3 minutes at a 1 minute interval)
# and posts "resolved" after 2 successes.

storage:
  type: sqlite
  path: /data/data.db

ui:
  title: Homelab status
  header: Homelab status

alerting:
  ntfy:
    url: "http://ntfy"
    topic: "srv-urgent"
    priority: 4
    token: "${NTFY_GATUS_TOKEN}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoint-defaults: &backend
  group: Backends
  interval: 1m
  client:
    timeout: 10s
  conditions:
    - "[STATUS] == 200"
  alerts:
    - type: ntfy

edge-defaults: &edge
  group: Edge
  interval: 5m
  client:
    timeout: 15s
  alerts:
    - type: ntfy

endpoints:
  # ── Backends ──────────────────────────────────────────────────────────
  - {<<: *backend, name: Sonarr,      url: "http://sonarr:8989/ping"}
  - {<<: *backend, name: Radarr,      url: "http://radarr:7878/ping"}
  - {<<: *backend, name: Prowlarr,    url: "http://prowlarr:9696/ping"}
  - {<<: *backend, name: Bazarr,      url: "http://bazarr:6767/api/system/ping"}
  - {<<: *backend, name: Seerr,       url: "http://seerr:5055/api/v1/status"}
  - {<<: *backend, name: Jellyfin,    url: "http://jellyfin:8096/health"}
  - {<<: *backend, name: Maintainerr, url: "http://maintainerr:6246/"}
  - {<<: *backend, name: Tdarr,       url: "http://tdarr:8265/api/v2/status"}
  # qBittorrent shares gluetun's network, so this also proves gluetun is up.
  - {<<: *backend, name: qBittorrent, url: "http://qbittorrent:8080/"}
  - {<<: *backend, name: Immich,      url: "http://immich_server:2283/api/server/ping"}
  - {<<: *backend, name: Authentik,   url: "http://authentik-server:9000/-/health/live/"}
  - {<<: *backend, name: FreshRSS,    url: "http://freshrss:80/i/"}
  - {<<: *backend, name: ntfy,        url: "http://ntfy:80/v1/health"}
  - {<<: *backend, name: Homarr,      url: "http://homarr:7575/api/health/live"}
  - {<<: *backend, name: Beszel,      url: "http://beszel:8090/api/health"}
  - {<<: *backend, name: Netdata,     url: "http://netdata:19999/api/v1/info"}
  - {<<: *backend, name: OpenProject, url: "http://openproject:80/health_checks/default"}
  - <<: *backend
    name: Proxmox (pve)
    url: "https://10.42.0.10:8006/"
    client:
      insecure: true   # self-signed host certificate
      timeout: 10s

  # ── Edge: Traefik routes and certificates ────────────────────────────
  # Authentik answers 302 for gated names. Any answer below 500 means
  # Traefik routed the request and TLS worked.
  - <<: *edge
    name: Admin wildcard certificate
    url: "https://homepage.admin.jjventer.co.za/"
    client: {ignore-redirect: true, timeout: 15s}
    conditions:
      - "[STATUS] < 500"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - <<: *edge
    name: Home zone certificate
    url: "https://jellyfin.home.jjventer.co.za/health"
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  - <<: *edge
    name: Komodo
    url: "https://komodo.admin.jjventer.co.za/"
    client: {ignore-redirect: true, timeout: 15s}
    conditions:
      - "[STATUS] < 500"
  - <<: *edge
    name: Homepage
    url: "https://homepage.admin.jjventer.co.za/"
    client: {ignore-redirect: true, timeout: 15s}
    conditions:
      - "[STATUS] < 500"

  # ── Public ────────────────────────────────────────────────────────────
  - name: Jellyfin (public, Cloudflare tunnel)
    group: Public
    url: "https://jellyfin.jjventer.co.za/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: ntfy
  - name: AdGuard DNS
    group: Public
    url: "10.42.0.12"
    interval: 5m
    dns:
      query-name: "jellyfin.home.jjventer.co.za"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 10.42.0.11"
    alerts:
      - type: ntfy
