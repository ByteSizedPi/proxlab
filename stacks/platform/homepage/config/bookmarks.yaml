# Homepage bookmarks.
# Docs: https://gethomepage.dev/configs/bookmarks/
#
# WHY THIS FILE EXISTS
#
# JJ asked for a compact strip at the top of the dashboard: every service as
# an icon and a name, with the detailed cards further down the page. Homepage
# has no "compact" mode for SERVICE groups, so the strip is a BOOKMARK group
# that points at the same hrefs as the service cards in services.yaml.
#
# 2026-09-08: this was an icons-only strip of 8 favourites. It is now names
# plus icons, and it lists every service that has a web interface.
#
# It is NOT a "recently used" row and cannot be. Homepage records no clicks
# and has no dynamic panel. The order below is hand-written, so put the link
# you open every day first.
#
# ⚠️ The group name must differ from every group name in services.yaml. The
# docs are explicit: "Using the same name for a service and bookmark group can
# cause unexpected behavior like a bookmark group being hidden."
#
# ⚠️ A bookmark needs an href. The seven containers in the "Headless Services"
# group have no web interface, so they cannot appear in this strip. They are
# in services.yaml only.
#
# The `- icon:` list nesting below is required, not a typo. A bookmark name
# takes a LIST of one mapping.
#
# `description` is omitted on purpose. Homepage falls back to the hostname
# when there is none, and config/custom.css hides that line, so the strip
# stays two lines high. Icon names resolve against the dashboard-icons CDN,
# same as services.yaml.

