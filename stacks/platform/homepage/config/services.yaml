# Homepage services.
# Docs: https://gethomepage.dev/configs/services/
#
# Conventions used throughout this file:
#
#   href      the Traefik route, i.e. how a human reaches it. Tailnet-only.
#   widget    the service's OWN API, called by CONTAINER NAME over `media`,
#             never back through Traefik. Going through the proxy would mean
#             the dashboard breaks whenever Traefik does, and would put auth
#             in front of Homepage's own API calls.
#   server/   the docker socket proxy. With `showStats: true` in settings.yaml
#   container this renders live CPU and memory under every entry, which is the
#             only telemetry the headless services have.
#
# {{HOMEPAGE_VAR_*}} is substituted at runtime from the environment. The keys
# live in Komodo Variables, never here. See ../compose.yaml.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.admin.jjventer.co.za
        description: Media server, primary
        server: app-prod
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          showEpisodeNumber: true

    - Plex:
        icon: plex.png
        href: https://plex.admin.jjventer.co.za
        description: Media server, for TVs with no Jellyfin client
        server: app-prod
        container: plex
        widget:
          type: plex
          url: http://plex:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"

    - Seerr:
        icon: jellyseerr.png
        href: https://seerr.admin.jjventer.co.za
        description: Request management
        server: app-prod
        container: seerr
        # No native Homepage widget exists for Seerr, the unified
        # Overseerr/Jellyseerr successor. Its request-count endpoint gives the
        # same numbers the Jellyseerr widget would.
        widget:
          type: customapi
          url: http://seerr:5055/api/v1/request/count
          headers:
            X-Api-Key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          mappings:
            - field: pending
              label: Pending
              format: number
            - field: approved
              label: Approved
              format: number
            - field: processing
              label: Processing
              format: number
            - field: available
              label: Available
              format: number

    - Tdarr:
        icon: tdarr.png
        href: https://tdarr.admin.jjventer.co.za
        description: Library health checks, transcoding disabled
        server: app-prod
        container: tdarr
        widget:
          type: tdarr
          url: http://tdarr:8265

- Media Management:
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.admin.jjventer.co.za
        description: TV
        server: app-prod
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          enableQueue: true

    - Radarr:
        icon: radarr.png
        href: https://radarr.admin.jjventer.co.za
        description: Movies
        server: app-prod
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          enableQueue: true

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.admin.jjventer.co.za
        description: Indexer manager, 20 public trackers
        server: app-prod
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

    - Bazarr:
        icon: bazarr.png
        href: https://bazarr.admin.jjventer.co.za
        description: Subtitles
        server: app-prod
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

    - Maintainerr:
        icon: maintainerr.png
        href: https://maintainerr.admin.jjventer.co.za
        description: Library retention, no rules configured yet
        server: app-prod
        container: maintainerr
        # No native widget. Its API needs no auth, so this lists whatever
        # rule groups exist. Empty today, by design.
        widget:
          type: customapi
          url: http://maintainerr:6246/api/rules
          display: dynamic-list
          mappings:
            name: name
            label: id

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.admin.jjventer.co.za
        description: Torrent client, categories tv and movies
        server: app-prod
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
          enableLeechProgress: true

- Platform:
    - Traefik:
        icon: traefik.png
        href: https://traefik.admin.jjventer.co.za
        description: Reverse proxy and TLS
        server: app-prod
        container: traefik
        # The API is deliberately NOT exposed with --api.insecure, so this has
        # to go through the router, which carries BasicAuth. That is the one
        # widget here that does not talk to a container name.
        widget:
          type: traefik
          url: https://traefik.admin.jjventer.co.za
          username: "{{HOMEPAGE_VAR_TRAEFIK_USER}}"
          password: "{{HOMEPAGE_VAR_TRAEFIK_PASS}}"

    - Komodo:
        icon: mdi-lambda
        href: https://komodo.admin.jjventer.co.za
        description: GitOps deploys, this repo
        server: app-prod
        container: komodo-core-1
        # Komodo Core publishes 9120 on the HOST and joins no network this
        # container can see, hence host.docker.internal. Same reason traefik
        # and cloudflared need it.
        widget:
          type: komodo
          url: http://host.docker.internal:9120
          key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
          secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
          showSummary: true
          showStacks: true

# ── Everything below has NO web interface ────────────────────────────────
#
# Listed on purpose rather than hidden. None of these have an href, because
# there is nothing to open. What they do have is live container CPU and memory
# from the docker socket proxy, plus an API widget where the service exposes
# one at all.
- Headless Services:
    - FlareSolverr:
        icon: mdi-cloud-lock
        description: NO WEB UI. Solves Cloudflare challenges for 5 Prowlarr indexers
        server: app-prod
        container: flaresolverr
        # It has no UI but it does answer on / with its status and version.
        widget:
          type: customapi
          url: http://flaresolverr:8191/
          mappings:
            - field: msg
              label: Status
              format: text
            - field: version
              label: Version
              format: text

    - Recyclarr:
        icon: mdi-sync
        description: NO WEB UI. Syncs TRaSH profiles into Sonarr and Radarr, daily
        server: app-prod
        container: recyclarr

    - Decluttarr:
        icon: mdi-broom
        description: NO WEB UI. Download queue cleanup, currently in TEST MODE
        server: app-prod
        container: decluttarr

    - Cloudflared:
        icon: cloudflare-zero-trust.png
        description: NO WEB UI. Tunnel publishing the Komodo webhook listener only
        server: app-prod
        container: cloudflared

    - Socket Proxy (Traefik):
        icon: docker.png
        description: NO WEB UI. Read-only docker API for Traefik discovery
        server: app-prod
        container: socket-proxy

    - Socket Proxy (Homepage):
        icon: docker.png
        description: NO WEB UI. Read-only docker API for this dashboard, CONTAINERS only
        server: app-prod
        container: homepage-socket-proxy

    - Komodo MongoDB:
        icon: mongodb.png
        description: NO WEB UI. Komodo Core's database
        server: app-prod
        container: komodo-mongo-1
