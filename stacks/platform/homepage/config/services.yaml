# Homepage services.
# Docs: https://gethomepage.dev/configs/services/
#
# Conventions used throughout this file:
#
#   href      the Traefik route, i.e. how a human reaches it. Tailnet-only.
#   widget    the service's OWN API, called by CONTAINER NAME over `media`,
#             never back through Traefik. Going through the proxy would mean
#             the dashboard breaks whenever Traefik does, and would put auth
#             in front of Homepage's own API calls.
#   server/   the docker socket proxy. With `showStats: true` in settings.yaml
#   container this renders live CPU and memory under every entry, which is the
#             only telemetry the headless services have.
#
# {{HOMEPAGE_VAR_*}} is substituted at runtime from the environment. The keys
# live in Komodo Variables, never here. See ../compose.yaml.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.admin.jjventer.co.za
        description: Media server, primary
        server: pve-prod
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          showEpisodeNumber: true

    - Plex:
        icon: plex.png
        href: https://plex.admin.jjventer.co.za
        description: Media server, for TVs with no Jellyfin client
        server: pve-prod
        container: plex
        widget:
          type: plex
          url: http://plex:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"

    - Seerr:
        icon: jellyseerr.png
        href: https://seerr.admin.jjventer.co.za
        description: Request management
        server: pve-prod
        container: seerr
        # No native Homepage widget exists for Seerr, the unified
        # Overseerr/Jellyseerr successor. Its request-count endpoint gives the
        # same numbers the Jellyseerr widget would.
        widget:
          type: customapi
          url: http://seerr:5055/api/v1/request/count
          headers:
            X-Api-Key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          mappings:
            - field: pending
              label: Pending
              format: number
            - field: approved
              label: Approved
              format: number
            - field: processing
              label: Processing
              format: number
            - field: available
              label: Available
              format: number

    - Tdarr:
        icon: tdarr.png
        href: https://tdarr.admin.jjventer.co.za
        description: Library health checks, transcoding disabled
        server: pve-prod
        container: tdarr
        widget:
          type: tdarr
          url: http://tdarr:8265

- Media Management:
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.admin.jjventer.co.za
        description: TV
        server: pve-prod
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          # enableQueue deliberately OFF. It renders one row per queued
          # episode, and a season pack fan-out made this card taller than the
          # rest of the page combined. Homepage has no option to cap that list.
          # Without it the widget shows the counts (wanted / queued / series),
          # which is what a dashboard is for. Click through to Sonarr for the
          # actual queue.

    - Radarr:
        icon: radarr.png
        href: https://radarr.admin.jjventer.co.za
        description: Movies
        server: pve-prod
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          # Same reasoning as Sonarr above: counts, not a queue listing.

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.admin.jjventer.co.za
        description: Indexer manager, 20 public trackers
        server: pve-prod
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

    - Bazarr:
        icon: bazarr.png
        href: https://bazarr.admin.jjventer.co.za
        description: Subtitles
        server: pve-prod
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

    - Maintainerr:
        icon: maintainerr.png
        href: https://maintainerr.admin.jjventer.co.za
        description: Library retention, no rules configured yet
        server: pve-prod
        container: maintainerr
        # No native widget. Its API needs no auth, so this lists whatever
        # rule groups exist. Empty today, by design.
        widget:
          type: customapi
          url: http://maintainerr:6246/api/rules
          display: dynamic-list
          mappings:
            name: name
            label: id

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.admin.jjventer.co.za
        description: Torrent client, categories tv and movies
        server: pve-prod
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
          # enableLeechProgress deliberately OFF, same reason as the *arr
          # queues: it draws a progress bar per active torrent. The widget
          # still shows leech / download / seed / upload totals.

- Platform:
    - Traefik:
        icon: traefik.png
        href: https://traefik.admin.jjventer.co.za
        description: Reverse proxy and TLS
        server: pve-prod
        container: traefik
        # ⚠️ WIDGET DISABLED 2026-08-03. It returned 401 on every refresh.
        #
        # The API is deliberately NOT exposed with --api.insecure, so it can
        # only be reached through the dashboard router, which carries
        # BasicAuth. That middleware stores a BCRYPT HASH:
        #   traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$2y$05$...
        # Homepage needs the PLAINTEXT password that hashes to it, and a hash
        # cannot be reversed. If the plaintext is lost, the fix is to
        # regenerate the htpasswd pair, not to try to recover it.
        #
        # To re-enable: create Komodo Variables TRAEFIK_DASH_USER and
        # TRAEFIK_DASH_PASS (plaintext), then uncomment.
        # widget:
        #   type: traefik
        #   url: https://traefik.admin.jjventer.co.za
        #   username: "{{HOMEPAGE_VAR_TRAEFIK_USER}}"
        #   password: "{{HOMEPAGE_VAR_TRAEFIK_PASS}}"

    - Komodo:
        icon: mdi-lambda
        href: https://komodo.admin.jjventer.co.za
        description: GitOps deploys, this repo
        server: pve-prod
        container: komodo-core-1
        # ⚠️ WIDGET DISABLED 2026-08-03, and this one was doing harm.
        #
        # The Komodo Variables KOMODO_API_KEY and KOMODO_API_SECRET were never
        # created, so Komodo left the placeholders unsubstituted and Homepage
        # authenticated with the literal string "[[KOMODO_API_KEY]]" on every
        # refresh. Komodo counts failed logins:
        #   {"error":"Invalid user credentials | You have 4 attempts remaining"}
        # and by the time this was noticed it had progressed to HTTP 429.
        #
        # An unresolved placeholder is not a harmless blank. It is a wrong
        # credential presented on a timer against a service that locks out.
        #
        # To re-enable: create both Variables (Komodo > Settings > API Keys,
        # the secret is shown once), then uncomment.
        #
        # Komodo Core publishes 9120 on the HOST and joins no network this
        # container can see, hence host.docker.internal.
        # widget:
        #   type: komodo
        #   url: http://host.docker.internal:9120
        #   key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
        #   secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
        #   showSummary: true
        #   showStacks: true

    - Authentik:
        icon: authentik.png
        href: https://auth.admin.jjventer.co.za
        description: Identity provider, forward auth for the admin zone
        server: pve-prod
        container: authentik-server
        # ⚠️ WIDGET LEFT OFF. The authentik widget needs an API token with
        # read access to core/users and events/events. Creating a token that
        # can read the auth events log, so a dashboard can show a login count,
        # widens what a Homepage compromise reaches. Not worth it yet.
        #
        # To enable: Authentik > Directory > Tokens, then add an
        # AUTHENTIK_API_KEY Komodo Variable and uncomment.
        # widget:
        #   type: authentik
        #   url: http://authentik-server:9000
        #   key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"

    - Netdata:
        icon: netdata.png
        href: https://netdata.admin.jjventer.co.za
        description: Host and container metrics, 1 second resolution
        server: pve-prod
        container: netdata
        # The only widget here that needs NO credential. /api/v1/info is
        # unauthenticated, and the widget reads the alarm counts from it.
        # Reached over `ingress`, which both containers are on.
        widget:
          type: netdata
          url: http://netdata:19999

    - ntfy:
        icon: ntfy.png
        href: https://ntfy.admin.jjventer.co.za
        description: Push notifications, alert delivery for the estate
        server: pve-prod
        container: ntfy
        # ⚠️ WIDGET LEFT OFF, and the reason is not credentials. The ntfy
        # widget shows the LAST MESSAGE ON ONE TOPIC, so it needs a `topic:`
        # naming a single topic. Nothing publishes on a fixed topic yet. Pick
        # the topic first, then uncomment.
        # widget:
        #   type: ntfy
        #   url: http://ntfy:80
        #   topic: alerts

- Apps:
    - Immich:
        icon: immich.png
        href: https://immich.admin.jjventer.co.za
        description: Photos, two External Libraries on /mnt/safe
        server: pve-prod
        container: immich_server
        # ⚠️ WIDGET LEFT OFF. It needs an Immich API key. Add one when the
        # library rebuild is finished, not before: the photo and video counts
        # it shows are the numbers being reorganised right now, so a wrong
        # count on the dashboard would be noise, not a signal.
        #
        # To enable: Immich > Account Settings > API Keys, then add an
        # IMMICH_API_KEY Komodo Variable and uncomment.
        # widget:
        #   type: immich
        #   url: http://immich_server:2283
        #   key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
        #   version: 2

    - FreshRSS:
        icon: freshrss.png
        href: https://rss.admin.jjventer.co.za
        description: Feed reader, single operator
        server: pve-prod
        container: freshrss
        # ⚠️ WIDGET LEFT OFF. The freshrss widget authenticates against the
        # Google Reader API with the FreshRSS username and its separate API
        # PASSWORD, which is not the web login password. Both would have to
        # become Komodo Variables.
        #
        # To enable: FreshRSS > Settings > Profile > API management, set an
        # API password, then add FRESHRSS_USER and FRESHRSS_API_PASS and
        # uncomment.
        # widget:
        #   type: freshrss
        #   url: http://freshrss:80
        #   username: "{{HOMEPAGE_VAR_FRESHRSS_USER}}"
        #   password: "{{HOMEPAGE_VAR_FRESHRSS_PASS}}"

# ── Not containers on pve-prod ───────────────────────────────────
#
# Both of these run outside Docker, so neither can carry `server:` and
# `container:` and neither shows CPU or memory. They are here because they are
# the two admin pages that are opened when something is broken, and hunting
# for the URL at that moment is the wrong time.
#
#   Proxmox   the hypervisor UI on `pve`, 10.42.0.10:8006
#   AdGuard   DNS and ad blocking in LXC 100 on `pve`, 10.42.0.12:80
#
# Traefik fronts both through file-provider routes rather than docker labels.
# See ../../traefik/dynamic/proxmox.yml and ../../traefik/dynamic/adguard.yml.
- Infrastructure:
    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.admin.jjventer.co.za
        description: Hypervisor host management, Dell PowerEdge R720
        # ⚠️ WIDGET LEFT OFF. The proxmox widget needs a PVE API token, and
        # the API serves a self-signed certificate, so Homepage would also
        # need certificate verification turned off for that call. Two things
        # to get wrong for a VM count.
        #
        # A `proxmoxNode:` + `proxmoxVMID:` pair would give this entry live
        # CPU and memory in the same shape as the docker services, but it
        # needs the same API token. Same decision.
        # widget:
        #   type: proxmox
        #   url: https://10.42.0.10:8006
        #   username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
        #   password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"

    - AdGuard:
        icon: adguard-home.png
        href: https://adguard.admin.jjventer.co.za
        description: DNS and ad blocking, LXC 100. Holds the ACME TXT record
        # ⚠️ WIDGET LEFT OFF. /control/stats is behind AdGuard's own login, so
        # the widget needs that username and password as Komodo Variables.
        #
        # ⚠️ If it is ever enabled, point `url:` at 10.42.0.12 and NOT at
        # adguard.admin.jjventer.co.za. That name resolves through AdGuard to
        # Traefik, so calling it would send the request back out through the
        # proxy and depend on the service it is meant to be reporting on.
        # widget:
        #   type: adguard
        #   url: http://10.42.0.12
        #   username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
        #   password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

# ── Everything below has NO web interface ────────────────────────────────
#
# Listed on purpose rather than hidden. None of these have an href, because
# there is nothing to open. What they do have is live container CPU and memory
# from the docker socket proxy, plus an API widget where the service exposes
# one at all.
- Headless Services:
    - FlareSolverr:
        icon: mdi-cloud-lock
        description: NO WEB UI. Solves Cloudflare challenges for 5 Prowlarr indexers
        server: pve-prod
        container: flaresolverr
        # It has no UI but it does answer on / with its status and version.
        widget:
          type: customapi
          url: http://flaresolverr:8191/
          mappings:
            - field: msg
              label: Status
              format: text
            - field: version
              label: Version
              format: text

    - Recyclarr:
        icon: mdi-sync
        description: NO WEB UI. Syncs TRaSH profiles into Sonarr and Radarr, daily
        server: pve-prod
        container: recyclarr

    - Decluttarr:
        icon: mdi-broom
        description: NO WEB UI. Download queue cleanup, currently in TEST MODE
        server: pve-prod
        container: decluttarr

    - Cloudflared:
        icon: cloudflare-zero-trust.png
        description: NO WEB UI. Tunnel publishing the Komodo webhook listener only
        server: pve-prod
        container: cloudflared

    - Socket Proxy (Traefik):
        icon: docker.png
        description: NO WEB UI. Read-only docker API for Traefik discovery
        server: pve-prod
        container: socket-proxy

    - Socket Proxy (Homepage):
        icon: docker.png
        description: NO WEB UI. Read-only docker API for this dashboard, CONTAINERS only
        server: pve-prod
        container: homepage-socket-proxy

    - Komodo MongoDB:
        icon: mongodb.png
        description: NO WEB UI. Komodo Core's database
        server: pve-prod
        container: komodo-mongo-1

    - Authentik Worker:
        icon: authentik.png
        description: NO WEB UI. Runs Authentik's blueprints, outposts and tasks
        server: pve-prod
        container: authentik-worker

    - Authentik PostgreSQL:
        icon: postgres.png
        description: NO WEB UI. Authentik's database
        server: pve-prod
        container: authentik-postgresql

    - Immich Machine Learning:
        icon: immich.png
        description: NO WEB UI. Face and object recognition for Immich
        server: pve-prod
        container: immich_machine_learning

    - Immich PostgreSQL:
        icon: postgres.png
        description: NO WEB UI. Immich's database, pgvector for search
        server: pve-prod
        container: immich_postgres

    - Immich Valkey:
        icon: redis.png
        description: NO WEB UI. Immich's job queue
        server: pve-prod
        container: immich_redis

    - Socket Proxy (Netdata):
        icon: docker.png
        description: NO WEB UI. Read-only docker API for Netdata, CONTAINERS only
        server: pve-prod
        container: netdata-socket-proxy
