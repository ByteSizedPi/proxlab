# Homepage global settings.
# Docs: https://gethomepage.dev/configs/settings/

title: jjventer homelab
description: pve-prod service dashboard

# ── Page shape, 2026-09-08 ──────────────────────────────────────────────
#
# Two passes over the same services, top to bottom:
#
#   1. "All Services"  a compact strip of icon + name, every service that has
#                      a web interface. Bookmarks, not services, because a
#                      service card always draws its widget and its stats and
#                      there is no setting to suppress them.
#   2. everything else the detailed cards, with the docker CPU / MEM / RX / TX
#                      row rendered as an aligned table by config/custom.css.
#
# Group order on the page is the order of the keys below, not the order in
# services.yaml. A group missing from this list still renders, after these.
layout:
  # FIRST, and a BOOKMARK group. `header: false` drops the group title, so the
  # strip reads as a strip rather than a section. 6 columns keeps it to three
  # short lines on a 1080p screen.
  All Services:
    style: row
    columns: 6
    header: false

  # ── Detailed cards ───────────────────────────────────────────────────
  #
  # `style: row` + `columns: 1` throughout. One service per row, full page
  # width, stacked vertically. That is what makes these groups read as a
  # table rather than as a wall of cards.
  #
  # ⚠️ `style: row` with `columns: 1` is NOT the same as `style: columns`.
  # Both stack the services vertically, but `style: columns` also makes the
  # GROUP narrow (basis-1/4 at xl), so Media, Downloads and Platform would sit
  # side by side across the page. `row` keeps every group full width.
  #
  # `columns` is load-bearing for the table. Every card in a `row` group is
  # the same width, and custom.css gives every card the same
  # "name | CPU | MEM | RX | TX" template, so the stat cells line up down the
  # whole page. Raising this to 2 or 3 still aligns them, it just puts several
  # narrower tables beside each other. Above 3 the stat cells stop fitting on
  # one line. Homepage caps `columns` at 8.
  Media:
    style: row
    columns: 1
    icon: mdi-play-circle
  Media Management:
    style: row
    columns: 1
    icon: mdi-magnify-scan
  Downloads:
    style: row
    columns: 1
    icon: mdi-download
  Apps:
    style: row
    columns: 1
    icon: mdi-apps
  Platform:
    style: row
    columns: 1
    icon: mdi-server-network
  # Proxmox and AdGuard. Neither is a container on pve-prod, so neither has a
  # stats row. The table's first column is all they fill.
  Infrastructure:
    style: row
    columns: 1
    icon: mdi-lan
  # Everything with no web interface. JJ asked for these to be listed rather
  # than hidden, and separated so it is obvious there is nothing to click.
  # 13 rows of pure CPU and memory, which is the case the table helps most.
  Headless Services:
    style: row
    columns: 1
    icon: mdi-cog-transfer

headerStyle: boxed
statusStyle: dot
hideVersion: false
disableCollapse: false

# Show container CPU and memory under every service that declares
# `server:` + `container:`. This is what gives the headless services real
# numbers instead of a bare name, and it is what config/custom.css lays out
# as a table. Turning this off empties the table.
showStats: true

theme: dark
color: slate

target: _blank

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: false
